

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InstaGram Mini</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fafafa;color:#111;font-family:Arial,sans-serif}
header{background:white;padding:16px;border-bottom:1px solid #ddd;font-size:25px;font-weight:bold;font-family:cursive}
.container{max-width:420px;margin:45px auto;padding:25px;background:white;border:1px solid #ddd;text-align:center}
h2{font-family:cursive;font-size:30px}
input{width:100%;padding:13px;margin:7px 0;border:1px solid #ddd;border-radius:5px;background:#fafafa}
button{width:100%;padding:12px;margin-top:10px;background:#0095f6;color:white;border:0;border-radius:5px;font-weight:bold}
.secondary{background:#333}
.hidden{display:none}
#message{font-size:13px;color:#d00;margin:12px}
#profile{padding:25px;text-align:center}
.avatar{width:90px;height:90px;border-radius:50%;object-fit:cover;background:#eee}
</style>
</head>
<body>
<header>InstaGram Mini</header>

<div class="container" id="auth">
  <h2>InstaGram Mini</h2>
  <p>Sign up to see photos and videos from your friends.</p>

  <input id="fullname" placeholder="Full name">
  <input id="username" placeholder="Username">
  <input id="email" type="email" placeholder="Email address">
  <input id="password" type="password" placeholder="Password (minimum 6 characters)">

  <button onclick="signup()">Create Account</button>
  <button class="secondary" onclick="login()">Log In</button>
  <div id="message"></div>
</div>

<div id="profile" class="hidden">
  <img class="avatar" id="avatar" alt="Profile picture">
  <h2 id="welcome">Welcome!</h2>
  <p id="userhandle"></p>
  <p>Your InstaGram Mini account is active.</p>
  <button onclick="logout()">Log Out</button>
</div>

<script>
const SUPABASE_URL =
'https://bcavalrihbazfcjyccsg.supabase.co';

const SUPABASE_KEY =
'sb_publishable_7bJSW_IrTA1GalGR7E9Bzw_O2VzrAvQ';

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const $ = id => document.getElementById(id);

function message(text) {
  $('message').textContent = text;
}

async function signup() {
  const fullname = $('fullname').value.trim();
  const username = $('username').value.trim().toLowerCase();
  const email = $('email').value.trim();
  const password = $('password').value;

  if (!fullname || !username || !email || !password) {
    message('Please fill in all fields.');
    return;
  }

  if (!/^[a-z0-9_.]{3,20}$/.test(username)) {
    message('Username must be 3–20 characters.');
    return;
  }

  if (password.length < 6) {
    message('Password must have at least 6 characters.');
    return;
  }

  message('Creating your account...');

  const {data,error} = await db.auth.signUp({
    email,
    password,
    options: {
      data: {
        username,
        full_name: fullname
      }
    }
  });

  if (error) {
    message(error.message);
    return;
  }

  if (data.session) {
    await showProfile(data.session.user);
  } else {
    message('Account created! Check your email to confirm, then log in.');
  }
}

async function login() {
  const email = $('email').value.trim();
  const password = $('password').value;

  if (!email || !password) {
    message('Enter your email and password.');
    return;
  }

  message('Logging in...');

  const {data,error} = await db.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    message(error.message);
    return;
  }

  await showProfile(data.user);
}

async function showProfile(user) {
  const {data:profile,error} = await db
    .from('profiles')
    .select('username, full_name, avatar_url')
    .eq('id',user.id)
    .single();

  if (error) {
    message('Logged in, but profile could not load: '+error.message);
    return;
  }

  $('auth').classList.add('hidden');
  $('profile').classList.remove('hidden');
  $('welcome').textContent = profile.full_name || 'Welcome!';
  $('userhandle').textContent = '@'+profile.username;

  $('avatar').src = profile.avatar_url ||
    'https://placehold.co/100x100?text=User';
}

async function logout() {
  await db.auth.signOut();
  $('profile').classList.add('hidden');
  $('auth').classList.remove('hidden');
  message('You have logged out.');
}

db.auth.onAuthStateChange((event,session) => {
  if (event === 'SIGNED_IN' && session) {
    setTimeout(() => showProfile(session.user),0);
  }

  if (event === 'SIGNED_OUT') {
    $('profile').classList.add('hidden');
    $('auth').classList.remove('hidden');
  }
});

(async () => {
  const {data} = await db.auth.getSession();
  if (data.session) {
    await showProfile(data.session.user);
  }
})();

window.Telegram?.WebApp?.ready();
window.Telegram?.WebApp?.expand();
</script>
</body>
</html>
