
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InstaGram Mini</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { box-sizing:border-box; }
body {
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff;
  color:#111;
}
header {
  height:55px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  border-bottom:1px solid #eee;
  font-size:24px;
}
.logo {
  font-family:cursive;
  font-weight:bold;
}
.stories {
  display:flex;
  overflow-x:auto;
  padding:14px 8px;
  gap:13px;
  border-bottom:1px solid #eee;
}
.story {
  min-width:65px;
  text-align:center;
  font-size:11px;
}
.story img {
  width:62px;
  height:62px;
  border-radius:50%;
  object-fit:cover;
  padding:3px;
  border:2px solid #e1306c;
}
.post-head {
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px;
}
.post-head img {
  width:35px;
  height:35px;
  border-radius:50%;
}
.post-photo {
  width:100%;
  height:330px;
  object-fit:cover;
}
.actions {
  display:flex;
  gap:17px;
  padding:12px;
  font-size:25px;
}
.actions span { cursor:pointer; }
.caption { padding:0 12px 15px; font-size:14px; }
.bottom {
  position:fixed;
  bottom:0;
  background:white;
  border-top:1px solid #eee;
  width:100%;
  display:flex;
  justify-content:space-around;
  padding:14px 0;
  font-size:24px;
}
main { padding-bottom:65px; }
</style>
</head>
<body>

<header>
  <span class="logo">InstaGram Mini</span>
  <span>♡　✉</span>
</header>

<div class="stories">
  <div class="story">
    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150">
    <p>Your story</p>
  </div>
  <div class="story">
    <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150">
    <p>Alex</p>
  </div>
  <div class="story">
    <img src="https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=150">
    <p>Sarah</p>
  </div>
  <div class="story">
    <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=150">
    <p>David</p>
  </div>
</div>

<main id="feed">
  <div class="post">
    <div class="post-head">
      <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=100">
      <b>@alex_official</b>
    </div>
    <img class="post-photo"
      src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=800">
    <div class="actions">
      <span onclick="like(this)">♡</span>
      <span onclick="alert('Comments coming soon!')">♡</span>
      <span onclick="alert('Share coming soon!')">➤</span>
      <span style="margin-left:auto">♧</span>
    </div>
    <div class="caption">
      <b>1,245 likes</b>
      <p><b>@alex_official</b> Enjoying life one day at a time ✨</p>
      <small>View all 28 comments</small>
    </div>
  </div>

  <div class="post">
    <div class="post-head">
      <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100">
      <b>@sarah_style</b>
    </div>
    <img class="post-photo"
      src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=800">
    <div class="actions">
      <span onclick="like(this)">♡</span>
      <span>♡</span>
      <span>➤</span>
      <span style="margin-left:auto">♧</span>
    </div>
    <div class="caption">
      <b>856 likes</b>
      <p><b>@sarah_style</b> New day, new energy ❤️</p>
    </div>
  </div>
</main>

<nav class="bottom">
  <span onclick="showTab('Home')">⌂</span>
  <span onclick="showTab('Explore')">⌕</span>
  <span onclick="showTab('Create')">⊕</span>
  <span onclick="showTab('Reels')">▣</span>
  <span onclick="showTab('Profile')">◉</span>
</nav>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

function like(el) {
  el.textContent = el.textContent === '♡' ? '♥' : '♡';
  el.style.color = el.textContent === '♥' ? 'red' : 'black';
}

function showTab(tab) {
  alert(tab + ' section is coming soon!');
}
</script>
</body>
</html>
